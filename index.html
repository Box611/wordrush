<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-font="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="单词冲刺 WordRush —— 四六级大纲词库打字练习。看英文打英文 / 看中文打英文 / 听音拼写，带音标、自动发音、WPM 统计，纯前端零后端。">
<meta name="theme-color" content="#4f46e5">
<title>单词冲刺 · WordRush</title>

<!--
  ===================================================================
  单词冲刺 WordRush · 入口页面
  -------------------------------------------------------------------
  【小白阅读指南】
  1. 这个项目是「纯前端」的，所有代码都跑在浏览器里，不需要服务器、不需要数据库。
  2. 页面上的文字都是通过 data-i18n="xxx" 标记的，xxx 对应 assets/js/i18n.js 里的词条。
     想改界面文字，去 i18n.js 里改，不用动这个 HTML。
  3. 想改主题颜色，去 assets/css/style.css 文件最上面的 :root 变量区改。
  4. 想改练习内容（单词/短句/文章），去 assets/js/data/ 目录里改。
  5. 想换网站图标，改 assets/favicon.svg；完整标志见 assets/logo.svg。
  ===================================================================
-->

<!-- 网站图标：独立 SVG 文件，想改配色直接编辑 assets/favicon.svg -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- ============================================================
     图标库（SVG Sprite）。用 <use href="#icon-xxx"> 引用。
     新增图标：照抄下面任意一行结构即可。
     ============================================================ -->

  <symbol id="icon-keyboard" viewBox="0 0 24 24"><path d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Zm0 2v8h16V8H4Zm2 1.5h2v2H6v-2Zm3.5 0h2v2h-2v-2Zm3.5 0h2v2h-2v-2Zm3.5 0h2v2h-2v-2ZM6 12.5h2v2H6v-2Zm3.5 0h2v2h-2v-2Zm3.5 0h2v2h-2v-2Zm3.5 0h2v2h-2v-2Z"/></symbol>
  <symbol id="icon-sun" viewBox="0 0 24 24"><path d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-12 1.8 2.2h-3.6L12 3Zm0 18-1.8-2.2h3.6L12 21ZM3 12l2.2-1.8v3.6L3 12Zm18 0-2.2 1.8v-3.6L21 12ZM5.6 5.6l2.6 1.1-1.5 1.5-1.1-2.6Zm12.8 12.8-2.6-1.1 1.5-1.5 1.1 2.6ZM18.4 5.6l-1.1 2.6-1.5-1.5 2.6-1.1ZM5.6 18.4l1.1-2.6 1.5 1.5-2.6 1.1Z"/></symbol>
  <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.7 14.6A9 9 0 0 1 9.4 3.3a9 9 0 1 0 11.3 11.3ZM17 12.8a7 7 0 0 1-5.8-5.8 7 7 0 1 0 5.8 5.8Z"/></symbol>
  <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 2 .8A3 3 0 0 1 14 4h6v14h-6a2 2 0 0 0-2 2 2 2 0 0 0-2-2H4V4Zm2 2v10h4a4 4 0 0 1 1 .1V6.8A1 1 0 0 0 10 6H6Zm12 0h-4a1 1 0 0 0-1 .8v9.3a4 4 0 0 1 1-.1h4V6Z"/></symbol>

  <symbol id="icon-gear" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm0-2a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm-1.4-11h2.8l.4 2.2c.5.2 1 .4 1.4.8l2.1-.8 1.4 2.4-1.8 1.4a5.6 5.6 0 0 1 0 1.6l1.8 1.4-1.4 2.4-2.1-.8c-.4.3-.9.6-1.4.8l-.4 2.2h-2.8l-.4-2.2c-.5-.2-1-.5-1.4-.8l-2.1.8-1.4-2.4 1.8-1.4a5.6 5.6 0 0 1 0-1.6L4.2 9.1l1.4-2.4 2.1.8c.4-.4.9-.6 1.4-.8l.5-2.2Z"/></symbol>
  <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 4h2v14h14v2H4V4Zm5 10h2v4H9v-4Zm4-5h2v9h-2V9Zm4-3h2v12h-2V6Z"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6 6.4 5Z"/></symbol>
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12 8 5.2Z"/></symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></symbol>
  <symbol id="icon-download" viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16 6.3 10.3l1.4-1.4L11 12.2V3ZM5 18h14v2H5v-2Z"/></symbol>
  <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16 6.3 10.3l1.4-1.4L11 12.2V3h2v9.2l3.3-3.3 1.4 1.4L12 16Zm-7 2h14v2H5v-2Z"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></symbol>
  <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M6 4h12v2h3v3a4 4 0 0 1-4 4h-.4A6 6 0 0 1 13 16.8V19h3v2H8v-2h3v-2.2A6 6 0 0 1 7.4 13H7a4 4 0 0 1-4-4V6h3V4ZM5 8v1a2 2 0 0 0 2 2V8H5Zm12 0v3a2 2 0 0 0 2-2V8h-2Z"/></symbol>
  <symbol id="icon-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>
  <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M12 5c5 0 9 4.5 9 7s-4 7-9 7-9-4.5-9-7 4-7 9-7Zm0 2c-3.6 0-6.7 3-7.7 5 1 2 4.1 5 7.7 5s6.7-3 7.7-5c-1-2-4.1-5-7.7-5Zm0 1.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Zm0 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></symbol>

  <!--
    站点标志「单词冲刺 / WordRush」。
    viewBox 是按图形旋转后的实际包围盒算出来的（内容 x∈[14.1,173.0] y∈[20.2,225.2]），
    所以放到顶栏里不会被裁切。渐变定义放在 symbol 内部，避免和别处的 id 撞名。
  -->
  <symbol id="icon-wordrush" viewBox="-20 10 226 226">
    <defs>
      <linearGradient id="wrGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3EE6C4"/>

      <line x1="20" y1="202" x2="70" y2="202" stroke="#3EE6C4" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
      <line x1="120" y1="125" x2="139" y2="30"
            stroke="url(#wrGrad)" stroke-width="16" stroke-linecap="round"/>
      <path d="M 70 100 L 95 180 L 120 125 L 145 180 L 170 100"
            fill="none" stroke="url(#wrGrad)" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="95"  y1="180" x2="85"  y2="208" stroke="url(#wrGrad)" stroke-width="9" stroke-linecap="round"/>
      <line x1="145" y1="180" x2="153" y2="208" stroke="url(#wrGrad)" stroke-width="9" stroke-linecap="round"/>
    </g>
  </symbol>
</svg>


<!-- ============================================================
     顶部工具栏
     ============================================================ -->
<header class="topbar">
  <div class="brand">
    <span class="brand-logo"><svg class="logo-mark" role="img" aria-label="WordRush"><use href="#icon-wordrush"/></svg></span>
    <span class="brand-text">
      <strong data-i18n="app.name">单词冲刺</strong>
      <small data-i18n="app.slogan">边打字边背单词 · 四六级</small>
    </span>
  </div>

  <div class="topbar-tools">
    <button class="icon-btn" id="btnStats" type="button" data-i18n-title="toolbar.stats" title="成绩记录">
      <svg class="ic"><use href="#icon-chart"/></svg>
    </button>
    <button class="icon-btn" id="btnAchievements" type="button" data-i18n-title="toolbar.badges" title="成就徽章">
      <svg class="ic"><use href="#icon-trophy"/></svg>
    </button>
    <button class="icon-btn" id="btnTheme" type="button" data-i18n-title="toolbar.theme" title="切换主题">
      <svg class="ic" id="themeIcon"><use href="#icon-sun"/></svg>
    </button>
    <button class="icon-btn text-icon" id="btnLang" type="button" data-i18n-title="toolbar.lang" title="中 / EN">中</button>
    <button class="icon-btn" id="btnSettings" type="button" data-i18n-title="toolbar.settings" title="设置">
      <svg class="ic"><use href="#icon-gear"/></svg>
    </button>
  </div>
</header>


<!-- ============================================================
     设置区：练习模式 / 打错处理
     （三个模式都保留，只能选一个；用分段控件切换，一眼看清当前状态）
     ============================================================ -->
<section class="controlbar">
  <div class="control-group">
    <span class="control-label" data-i18n="label.practiceMode">练习模式</span>
    <div class="segmented" id="segPracticeMode" role="group">
      <button type="button" data-value="en2en"><span data-i18n="mode.en2en">看英文打英文</span></button>
      <button type="button" data-value="zh2en"><span data-i18n="mode.zh2en">看中文打英文</span></button>
      <button type="button" data-value="listen"><span data-i18n="mode.listen">听发音打英文</span></button>
    </div>
  </div>

  <div class="control-group">
    <span class="control-label" data-i18n="label.errorMode">打错处理</span>
    <div class="segmented" id="segErrorMode" role="group">
      <button type="button" data-value="strict"><span data-i18n="mode.strict">严格模式</span></button>
      <button type="button" data-value="loose"><span data-i18n="mode.loose">宽松模式</span></button>
      <button type="button" data-value="sentence"><span data-i18n="mode.sentence">整句模式</span></button>
    </div>
  </div>
</section>

<!-- 一句话说明当前选中的两种模式到底是干什么的（对新手很重要） -->
<p class="modehint" id="modeHint"></p>


<!-- ============================================================
     内容源选择条
     ============================================================ -->
<section class="sourcebar">
  <div class="chips" id="sourceChips">
    <!-- 由 assets/js/ui.js 动态生成，避免手写重复标签 -->
  </div>
  <div class="sourcebar-right">
    <label class="mini-field">
      <span data-i18n="label.count">每组数量</span>
      <select id="selCount">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="30">30</option>
        <option value="50">50</option>
      </select>
    </label>
    <button class="btn ghost" id="btnCustom" type="button">
      <svg class="ic"><use href="#icon-plus"/></svg><span data-i18n="btn.custom">自定义文本</span>
    </button>
  </div>
</section>


<!-- ============================================================
     练习主舞台
     ============================================================ -->
<main class="stage" id="stage">
  <div class="stage-head">
    <div class="stage-meta">
      <span class="badge" id="sourceLabel">CET-4</span>
      <span class="badge ghost" id="itemCounter">1 / 20</span>
      <span class="badge ghost" id="roundCounter" hidden></span>
    </div>
    <div class="stage-head-actions">
      <button class="icon-btn round" id="btnSpeak" type="button" data-i18n-title="btn.speak" title="播放发音">
        <svg class="ic"><use href="#icon-play"/></svg>
      </button>
      <button class="btn ghost small" id="btnSkip" type="button" data-i18n="btn.skip">跳过</button>
      <button class="btn ghost small" id="btnRestart" type="button">
        <svg class="ic"><use href="#icon-refresh"/></svg><span data-i18n="btn.restart">重新开始</span>
      </button>
    </div>
  </div>

  <!-- 提示区：看中文打英文 → 显示中文释义；听音模式 → 显示播放按钮提示 -->
  <div class="prompt" id="promptArea"></div>

  <!-- 文本展示区 + 隐藏输入框（点击区域任意位置都能聚焦） -->
  <div class="target-wrap" id="targetWrap">
    <div class="target" id="targetText" aria-live="polite" aria-atomic="true"></div>

    <!--
      ⚠️ 关键设计：这是一个「透明」的真实输入框，覆盖在文字上方。
      这样做的好处：
        1. 手机端点击后能正常唤起键盘（如果用 div 自己模拟键盘会很难做）；
        2. 电脑端可以正常使用中文/日文输入法而不出乱码；
        3. 系统自带的粘贴、选择、撤销等行为都是原生可用的。
      文字的实际显示由上面的 #targetText 负责着色，输入框本身不可见。
    -->
    <input id="typeInput" class="type-input" type="text"
           autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" inputmode="text" aria-label="Typing input">

    <!-- 未聚焦时盖一层提示，引导用户点击开始 -->
    <div class="stage-overlay" id="stageOverlay">
      <svg class="ic big"><use href="#icon-keyboard"/></svg>
      <span data-i18n="hint.clickToStart">点击这里开始输入</span>
      <kbd>Tab</kbd><span data-i18n="hint.tabToRestart">重新开始本轮</span>
    </div>
  </div>

  <!-- 整句模式的判定结果（只在整句模式下显示） -->
  <div class="sentence-feedback" id="sentenceFeedback" hidden></div>

  <!-- 实时打字提示/错误提醒（例如：数据来源不支持中文模式时的说明） -->
  <div class="stage-note" id="stageNote" hidden></div>
</main>


<!-- ============================================================
     底部统计栏
     ============================================================ -->
<footer class="statsbar">
  <div class="stat" data-k="wpm">
    <span class="stat-value" id="statWpm">0</span>
    <span class="stat-label" data-i18n="stat.wpm">速度</span>
  </div>
  <div class="stat" data-k="acc">
    <span class="stat-value" id="statAcc">100<em>%</em></span>
    <span class="stat-label" data-i18n="stat.acc">正确率</span>
  </div>
  <div class="stat" data-k="combo">
    <span class="stat-value" id="statCombo">0</span>
    <span class="stat-label" data-i18n="stat.combo">连击</span>
  </div>
  <div class="stat" data-k="score">
    <span class="stat-value" id="statScore">0</span>
    <span class="stat-label" data-i18n="stat.score">得分</span>
  </div>
  <div class="stat" data-k="time">
    <span class="stat-value" id="statTime">0:00</span>
    <span class="stat-label" data-i18n="stat.time">用时</span>
  </div>
  <div class="stat progress-stat" data-k="progress">
    <div class="progress-head">
      <span class="stat-label" data-i18n="stat.progress">进度</span>
      <span class="stat-value small" id="statProgressText">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</footer>

<!-- 每日目标进度（可以在设置里关掉） -->
<div class="dailybar" id="dailyBar" hidden>
  <div class="dailybar-inner">
    <span class="daily-icon"><svg class="ic"><use href="#icon-bolt"/></svg></span>
    <span class="daily-text" id="dailyText"></span>
    <div class="progress-track slim"><div class="progress-fill" id="dailyFill"></div></div>
  </div>
</div>


<!-- ============================================================
     弹窗 1：设置
     ============================================================ -->
<div class="modal-mask" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 data-i18n="settings.title">设置</h2>
      <button class="icon-btn" type="button" data-close="settingsModal"><svg class="ic"><use href="#icon-close"/></svg></button>
    </div>
    <div class="modal-body" id="settingsBody"><!-- 由 ui.js 动态渲染 --></div>
  </div>
</div>

<!-- ============================================================
     弹窗 2：自定义文本
     ============================================================ -->
<div class="modal-mask" id="customModal" hidden>
  <div class="modal modal-wide" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 data-i18n="custom.title">自定义练习内容</h2>
      <button class="icon-btn" type="button" data-close="customModal"><svg class="ic"><use href="#icon-close"/></svg></button>
    </div>
    <div class="modal-body">
      <p class="modal-tip" data-i18n="custom.tip">粘贴任意英文文本，网站会自动拆分成「单词 / 句子 / 段落」，任选一种开始练习。</p>

      <textarea id="customText" class="textarea" rows="8"
        data-i18n-placeholder="custom.placeholder"
        placeholder="在此粘贴英文文本……&#10;例如：The quick brown fox jumps over the lazy dog."></textarea>

      <div class="row">
        <label class="mini-field">
          <span data-i18n="custom.splitAs">拆分方式</span>
          <select id="customUnit">
            <option value="sentence" data-i18n="custom.unit.sentence">按句子</option>
            <option value="word" data-i18n="custom.unit.word">按单词</option>
            <option value="paragraph" data-i18n="custom.unit.paragraph">按段落</option>
          </select>
        </label>
        <label class="mini-field">
          <span data-i18n="custom.pick">抽取条数</span>
          <select id="customCount">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
            <option value="all" data-i18n="custom.countAll">全部</option>
          </select>
        </label>
      </div>

      <div class="field">
        <label class="field-label" data-i18n="custom.zhLabel">中文释义（可选，用于「看中文打英文」）</label>
        <p class="field-hint" data-i18n="custom.zhHint">按行填写，每行对应上面拆分出的第 N 条。留空则该条无法用于中文模式。</p>
        <textarea id="customZh" class="textarea" rows="4"
          data-i18n-placeholder="custom.zhPlaceholder"
          placeholder="第一行的中文&#10;第二行的中文&#10;……"></textarea>
      </div>

      <div class="field">
        <label class="field-label" data-i18n="custom.urlLabel">从网址加载（可选 · 高级）</label>
        <p class="field-hint" data-i18n="custom.urlHint">受浏览器跨域限制，只有允许跨域访问的网址才能成功；失败时请用上面的粘贴方式。</p>
        <div class="row">
          <input id="customUrl" class="input" type="url" placeholder="https://example.com/article.txt">
          <button class="btn" id="btnLoadUrl" type="button"><span data-i18n="custom.loadUrl">加载</span></button>
        </div>
      </div>

      <div class="preview" id="customPreview"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" data-close="customModal"><span data-i18n="btn.cancel">取消</span></button>
      <button class="btn primary" id="btnUseCustom" type="button"><span data-i18n="custom.start">开始练习</span></button>
    </div>
  </div>
</div>

<!-- ============================================================
     弹窗 3：本次成绩
     ============================================================ -->
<div class="modal-mask" id="resultModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 data-i18n="result.title">本轮成绩</h2>
      <button class="icon-btn" type="button" data-close="resultModal"><svg class="ic"><use href="#icon-close"/></svg></button>
    </div>
    <div class="modal-body" id="resultBody"></div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" data-close="resultModal"><span data-i18n="btn.close">关闭</span></button>
      <button class="btn primary" id="btnResultAgain" type="button">
        <svg class="ic"><use href="#icon-refresh"/></svg><span data-i18n="btn.again">再来一轮</span>
      </button>
    </div>
  </div>
</div>

<!-- ============================================================
     弹窗 4：成绩记录 / 数据管理
     ============================================================ -->
<div class="modal-mask" id="statsModal" hidden>
  <div class="modal modal-wide" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 data-i18n="history.title">成绩记录</h2>
      <button class="icon-btn" type="button" data-close="statsModal"><svg class="ic"><use href="#icon-close"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="summary-cards" id="historySummary"></div>
      <div class="chart-wrap">
        <canvas id="historyChart" height="180"></canvas>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="historyTable"></table>
      </div>
      <div class="row data-actions">
        <button class="btn" id="btnExport" type="button">
          <svg class="ic"><use href="#icon-download"/></svg><span data-i18n="data.export">导出备份 (JSON)</span>
        </button>
        <button class="btn" id="btnImport" type="button">
          <svg class="ic"><use href="#icon-upload"/></svg><span data-i18n="data.import">导入备份</span>
        </button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <button class="btn danger" id="btnClearData" type="button"><span data-i18n="data.clear">清空所有数据</span></button>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     弹窗 5：成就徽章
     ============================================================ -->
<div class="modal-mask" id="achievementsModal" hidden>
  <div class="modal modal-wide" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 data-i18n="badges.title">成就徽章</h2>
      <button class="icon-btn" type="button" data-close="achievementsModal"><svg class="ic"><use href="#icon-close"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="badge-grid" id="badgeGrid"></div>
    </div>
  </div>
</div>

<!-- ============================================================
     弹窗 6：导入备份前的确认
     ⚠️ 导入会覆盖本机数据且不可撤销，所以必须让用户先看清
        「文件里有什么」和「本机现在有什么」，再决定要不要继续。
     ============================================================ -->
<div class="modal-mask" id="importModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 data-i18n="import.title">确认导入备份</h2>
      <button class="icon-btn" type="button" data-close="importModal"><svg class="ic"><use href="#icon-close"/></svg></button>
    </div>
    <div class="modal-body" id="importBody"><!-- 由 ui.js 动态渲染 --></div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" data-close="importModal"><span data-i18n="btn.cancel">取消</span></button>
      <button class="btn primary" id="btnConfirmImport" type="button"><span data-i18n="import.confirm">确认导入</span></button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
